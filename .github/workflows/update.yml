name: Update IP ranges

on:
  schedule:
    - cron: '0 5 * * *'
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Update IP ranges
        run: bash update.sh

      - uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Updated Claude API IP ranges."
